  <head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">

    <title>Recharge & Consommation</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Journal de recharge</h1>

    <table id="monTableau">
      <tr>
        <th>Témoin de suppression</th>
        <th>Date & Heure</th>
        <th>Type de recharge</th>
        <th>Consommation (Wh)</th>
        <th>Kilométrage (km)</th>
        <th>Coût (€)</th>
        <th>Enregistré</th>
      </tr>
    </table>

    <button id="ajouter">Ajouter une ligne</button>
    <button id="enregistrer">Enregistrer</button>
    <button id="toggleCheck">Tout cocher / Tout décocher</button>
    <button id="supprimer">Supprimer les lignes cochées</button>
    <button id="exportCSV" style="background:#2ecc71;">Exporter en CSV</button>

    <!-- 📊 CANVAS DU GRAPHIQUE -->
    <h2 style="text-align:center;margin-top:30px;">Évolution du kilométrage</h2>
    <canvas id="graphKm" style="width:100%;max-width:900px;margin:auto;"></canvas>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
